name: HY Individual DevOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_log:
        description: "Generate error log if tests fail"
        required: true
        default: "false"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          OPEN_API_KEY: ${{ secrets.OPEN_API_KEY }}
        run: pytest --maxfail=1 --disable-warnings -q

      # ------------------------------------------------------
      # Error logging – körs bara om tester misslyckas OCH
      # create_log = true i workflow_dispatch
      # ------------------------------------------------------
      - name: Generate error log
        if: failure() && github.event.inputs.create_log == 'true'
        run: |
          echo "Tests failed in workflow run ${GITHUB_RUN_ID}" > error_log.txt
          echo "Timestamp: $(date)" >> error_log.txt
          echo "Branch: ${GITHUB_REF_NAME}" >> error_log.txt
          echo "Commit: ${GITHUB_SHA}" >> error_log.txt
          echo "See full workflow logs in GitHub Actions." >> error_log.txt

      - name: Upload error log artifact
        if: failure() && github.event.inputs.create_log == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: error-log
          path: error_log.txt

      - name: Print Docker username (for debugging)
        run: echo "Docker username: ${{ secrets.DOCKER_USERNAME }}"


  build_and_push:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Validate DockerHub credentials
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "Missing Docker username."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "Missing Docker password."
            exit 1
          fi
          echo "Credentials validated for user: ${{ secrets.DOCKER_USERNAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/flask_app:latest
          platforms: linux/amd64
